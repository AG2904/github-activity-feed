name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The suites only need the checkout: neither one talks to GitHub or to a real
# relay. No repository secrets are involved.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheapest job, so it goes first: a doubly encoded file is invisible to every
  # other check here — "sólo" stored as "sÃ³lo" still looks like text, and a grep
  # for the word misses it. Four such files were committed before this existed.
  docs:
    name: Docs (encoding, diagrams)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Check markdown encoding
        run: node tools/check-encoding.mjs

      - name: Check one run per diagram
        # Archify writes a timestamped directory per run, so a regenerated
        # diagram leaves its predecessor in the tree — and, once committed, in
        # the remote, where nobody looks at it again.
        run: node tools/prune-diagrams.mjs --check

  # Relay and client are independent on purpose: they share the event contract
  # and nothing else, so a red relay suite must not hide a red client suite.
  relay:
    name: Relay (NestJS)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test (end-to-end)
        run: npm test

  client:
    name: Client (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go 1.27
        uses: actions/setup-go@v7
        with:
          # client/go.mod declares `go 1.27.0`; let the module be the source of
          # truth instead of repeating the version here.
          go-version-file: client/go.mod
          # The built-in cache keys on go.sum, which this module does not have
          # (it has no external dependencies). The explicit cache below keys on
          # go.mod instead and never fails for a missing go.sum.
          cache: false

      - name: Cache Go build output
        uses: actions/cache@v6
        with:
          # Only the build cache is cached. The module cache (~/go/pkg/mod)
          # stays empty because this module has no external dependencies, so
          # there is nothing to restore. The key is derived from a single
          # constant file, so restore-keys would only widen a key that already
          # matches and buy nothing.
          path: ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('client/go.mod') }}

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found files that need formatting:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test (end-to-end)
        # -count=1 is load-bearing: the e2e package builds the binary in
        # TestMain, so without it Go can return a cached pass when only
        # internal/ changed.
        run: go test -count=1 ./...

  # Dockerfile is not exercised by the two suites above: a broken relay stage
  # and a broken feed stage fail in different places, and a broken Dockerfile
  # is invisible to both. This job builds each image and proves it runs.
  docker:
    name: Images (Docker)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Build the relay image
        run: docker build --target relay -t relay:ci .

      - name: Build the feed image
        run: docker build --target feed -t feed:ci .

      - name: Smoke the feed image
        # The binary is static: if this prints a version, the runtime stage
        # has what it needs and the entrypoint is right.
        run: docker run --rm feed:ci --version

      - name: Smoke the relay image
        # A relay that boots without a secret throws, and one that cannot open
        # SQLite throws next. /history answering proves both happened.
        run: |
          docker run -d --name relay -e GITHUB_WEBHOOK_SECRET=ci -p 3000:3000 relay:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/history > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::the relay image never answered /history"
          docker logs relay
          exit 1
